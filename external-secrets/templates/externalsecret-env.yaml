{{- if .Values.onepassword }}
{{- if .Values.onepassword.enabled }}
{{- $provider := "onepassword" }}
{{- $config := .Values.onepassword }}
{{- range $config.secrets }}
{{- if .envVars }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-%s-env" (include "helm-helpers.fullname" $) $provider }}
  namespace: {{ include "helm-helpers.namespace" $ }}
  labels:
    {{- include "helm-helpers.labels" $ | nindent 4 }}
    app.kubernetes.io/component: externalsecret
    app.kubernetes.io/provider: {{ $provider }}
spec:
  refreshInterval: {{ $config.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $config.clusterSecretStoreRef }}
  target:
    creationPolicy: Owner
  data:
    {{- range .envVars }}
    {{- $secretKey := .secretKey }}
    {{- range $key, $value := .mappings }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $secretKey }}
        property: {{ $value }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
