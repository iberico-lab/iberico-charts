suite: external secrets
release:
  name: shop
set:
  enabled: true
  onepassword:
    enabled: true
    secrets:
      - envVars: [{ secretKey: db, mappings: { DB_PASS: password } }]
      - envVars: [{ secretKey: api, mappings: { API_KEY: key } }]
tests:
  - it: merges every entry into one ExternalSecret
    templates: [templates/externalsecret-env.yaml]
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: shop-onepassword-env }
      - lengthEqual: { path: spec.data, count: 2 }

  - it: fails when the same env var is mapped twice
    templates: [templates/externalsecret-env.yaml]
    set:
      onepassword.secrets:
        - envVars: [{ secretKey: a, mappings: { X: p } }]
        - envVars: [{ secretKey: b, mappings: { X: q } }]
    asserts:
      - failedTemplate: { errorPattern: 'env var "X" is mapped more than once' }

  - it: renders nothing unless the chart is enabled
    templates: [templates/externalsecret-env.yaml]
    set: { enabled: false }
    asserts:
      - hasDocuments: { count: 0 }
