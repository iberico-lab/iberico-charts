{{- if .Values.enabled }}
{{- if and .Values.onepassword .Values.onepassword.enabled }}
{{- $provider := "onepassword" }}
{{- $config := .Values.onepassword }}
{{- $data := include "external-secrets.onepassword.data" (dict "config" $config "field" "envVars" "label" "env var") }}
{{- if $data }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-%s-env" (include "helm-helpers.fullname" $) $provider }}
  namespace: {{ include "helm-helpers.namespace" $ }}
  labels:
    {{- include "helm-helpers.labels" $ | nindent 4 }}
    app.kubernetes.io/component: externalsecret
    app.kubernetes.io/provider: {{ $provider }}
spec:
  refreshInterval: {{ $config.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $config.clusterSecretStoreRef }}
  target:
    creationPolicy: Owner
  data:
    {{- $data | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
