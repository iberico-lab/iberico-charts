global:
    name: ""

# External Secrets configuration by provider
onepassword:
    enabled: true  # on whenever this chart is enabled; set false to turn 1Password off
    refreshInterval: "10m"
    # Name of an existing ClusterSecretStore; this chart does not create one.
    clusterSecretStoreRef: onepassword-cluster
    # All entries are merged into one ExternalSecret for env vars
    # (<app>-onepassword-env) and one for files (<app>-onepassword-files).
