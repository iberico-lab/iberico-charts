{{- if and (.Values.workload.enabled | default false) (eq (include "app.workloadType" .) "Deployment") -}}
{{- $multi := or (gt (int $.Values.workload.replicas) 1) ($.Values.autoscaling.enabled | default false) -}}
{{- range .Values.persistence }}
{{- $modes := .accessModes | default (list "ReadWriteOnce") -}}
{{- if and $multi (or (has "ReadWriteOnce" $modes) (has "ReadWriteOncePod" $modes)) -}}
{{- fail (printf "persistence %q is %s, so only one pod can use it, but this Deployment runs several pods (replicas > 1 or autoscaling). Use replicas: 1, a ReadWriteMany storage class, or workload.type: StatefulSet (one disk per pod)" .name (join "/" $modes)) -}}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-%s" (include "helm-helpers.fullname" $) .name }}
  namespace: {{ include "helm-helpers.namespace" $ }}
  labels:
    {{- include "helm-helpers.labels" $ | nindent 4 }}
    app.kubernetes.io/component: pvc
  {{- with include "app.pvcAnnotations" (dict "root" $ "pvc" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml $modes | nindent 4 }}
  resources:
    requests:
      storage: {{ .size }}
  {{- if .storageClassName }}
  storageClassName: {{ .storageClassName }}
  {{- end }}
{{- end }}
{{- end }}
