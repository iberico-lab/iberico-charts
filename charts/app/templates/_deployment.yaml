{{- define "app.deployment" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm-helpers.fullname" . }}
  namespace: {{ include "helm-helpers.namespace" . }}
  labels:
    {{- include "helm-helpers.labels" . | nindent 4 }}
  {{- with include "app.workloadAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- /* the autoscaler owns the replica count; setting it here would reset it on every upgrade */}}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.workload.replicas }}
  {{- end }}
  {{- $strategy := .Values.workload.strategy | default dict }}
  {{- $type := $strategy.type | default (ternary "Recreate" "RollingUpdate" (eq (include "app.hasSingleWriterDisk" .) "true")) }}
  strategy:
    type: {{ $type }}
    {{- if eq $type "RollingUpdate" }}
    {{- $ru := $strategy.rollingUpdate | default dict }}
    {{- if and (eq (toString $ru.maxUnavailable) "0") (eq (toString $ru.maxSurge) "0") }}
    {{- fail "workload.strategy.rollingUpdate: maxUnavailable and maxSurge can't both be 0, or no pod could ever be replaced. Set maxSurge: 1" }}
    {{- end }}
    {{- with $ru }}
    rollingUpdate:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "helm-helpers.selectorLabels" . | nindent 6 }}
  template:
    {{- include "app.podTemplate" . | nindent 4 }}
{{- end -}}
