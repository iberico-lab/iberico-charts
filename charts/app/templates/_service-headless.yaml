{{- define "app.serviceHeadless" }}
{{- $h := .Values.service.headless | default dict }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.headlessName" . }}
  namespace: {{ include "helm-helpers.namespace" . }}
  labels:
    {{- include "helm-helpers.labels" . | nindent 4 }}
    app.kubernetes.io/component: service-cluster
  {{- with $h.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "helm-helpers.selectorLabels" . | nindent 4 }}
  ports:
    {{- if $h.ports }}
    {{- range $h.ports }}
    - port: {{ .port }}
      targetPort: {{ .targetPort | default .port }}
      protocol: {{ .protocol | default "TCP" }}
      name: {{ .name | quote }}
    {{- end }}
    {{- else }}
    - port: {{ $h.port | default .Values.workload.applicationPort }}
      targetPort: {{ $h.targetPort | default .Values.workload.applicationPort }}
      protocol: TCP
      name: {{ .Values.service.portName | default "http" | quote }}
    {{- end }}
{{- end -}}
