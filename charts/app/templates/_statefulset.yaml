{{- define "app.statefulset" -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helm-helpers.fullname" . }}
  namespace: {{ include "helm-helpers.namespace" . }}
  labels:
    {{- include "helm-helpers.labels" . | nindent 4 }}
  {{- with include "app.workloadAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ .Values.workload.serviceName | default (printf "%s-cluster" (include "helm-helpers.fullname" .)) }}
  replicas: {{ .Values.workload.replicas }}
  {{- with .Values.workload.podManagementPolicy }}
  podManagementPolicy: {{ . }}
  {{- end }}
  {{- with .Values.workload.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "helm-helpers.selectorLabels" . | nindent 6 }}
  template:
    {{- include "app.podTemplate" . | nindent 4 }}
  {{- if .Values.persistence }}
  volumeClaimTemplates:
    {{- range .Values.persistence }}
    - metadata:
        name: {{ .name }}
        labels:
          {{- include "helm-helpers.labels" $ | nindent 10 }}
          app.kubernetes.io/component: pvc
        {{- with include "app.pvcAnnotations" (dict "root" $ "pvc" .) }}
        annotations:
          {{- . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml (.accessModes | default (list "ReadWriteMany")) | nindent 10 }}
        resources:
          requests:
            storage: {{ .size }}
        {{- if .storageClassName }}
        storageClassName: {{ .storageClassName }}
        {{- end }}
    {{- end }}
  {{- end }}
{{- end -}}
