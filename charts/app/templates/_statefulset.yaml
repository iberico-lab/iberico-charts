{{- define "app.statefulset" -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helm-helpers.fullname" . }}
  namespace: {{ include "helm-helpers.namespace" . }}
  labels:
    {{- include "helm-helpers.labels" . | nindent 4 }}
  {{- with .Values.workload.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ .Values.workload.serviceName | default (printf "%s-cluster" (include "helm-helpers.fullname" .)) }}
  replicas: {{ .Values.workload.replicas }}
  {{- if .Values.workload.updateStrategy }}
  updateStrategy:
    {{- toYaml .Values.workload.updateStrategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "helm-helpers.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.workload.pod.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "helm-helpers.labels" . | nindent 8 }}
    spec:
      {{- if .Values.workload.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.workload.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.workload.extraInitContainers }}
      initContainers:
        {{- include "app.initContainers" . | nindent 8 }}
      {{- end }}
      containers:
        {{- include "app.container" . | nindent 8 }}
        {{- if .Values.workload.extraContainers }}
        {{- include "app.extraContainers" . | nindent 8 }}
        {{- end }}
      {{- if or .Values.workload.volumes .Values.persistence (include "app.onepassword.has" (dict "root" . "field" "files")) }}
      volumes:
        {{- include "app.volume" . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence }}
  volumeClaimTemplates:
    {{- range .Values.persistence }}
    - metadata:
        name: {{ .name }}
        labels:
          {{- include "helm-helpers.labels" $ | nindent 10 }}
          app.kubernetes.io/component: pvc
        {{- with .annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if eq (.storageClassName | default "") "opendrive" }}
        annotations:
          csi-rclone/storage-path: {{ if .rclone }}{{ .rclone.storagePath | default (include "helm-helpers.fullname" $) }}{{ else }}{{ include "helm-helpers.fullname" $ }}{{ end }}
          csi-rclone/umask: {{ if .rclone }}{{ .rclone.umask | default "022" | quote }}{{ else }}"022"{{ end }}
          {{- if .rclone }}
          {{- if .rclone.annotations }}
          {{- toYaml .rclone.annotations | nindent 10 }}
          {{- end }}
          {{- end }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml (.accessModes | default (list "ReadWriteMany")) | nindent 10 }}
        resources:
          requests:
            storage: {{ .size }}
        {{- if .storageClassName }}
        storageClassName: {{ .storageClassName }}
        {{- end }}
    {{- end }}
  {{- end }}
{{- end -}}
