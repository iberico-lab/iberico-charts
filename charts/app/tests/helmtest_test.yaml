suite: helm test hook
templates: [templates/tests/test-connection.yaml]
release:
  name: shop
tests:
  - it: checks the Service port as a test hook
    asserts:
      - isKind: { of: Pod }
      - equal: { path: 'metadata.annotations["helm.sh/hook"]', value: test }
      - matchRegex: { path: 'spec.containers[0].command[2]', pattern: 'nc -z -w 5 shop 80' }

  - it: can be turned off
    set: { helmTest.enabled: false }
    asserts:
      - hasDocuments: { count: 0 }
