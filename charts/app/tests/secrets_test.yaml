suite: 1Password secrets wiring
templates:
  - templates/workload.yaml
release:
  name: shop
values:
  - values/two-secrets.yaml
tests:
  - it: mounts the files secret exactly once
    asserts:
      - lengthEqual: { path: spec.template.spec.volumes, count: 1 }
      - lengthEqual: { path: 'spec.template.spec.containers[0].volumeMounts', count: 1 }
      - equal: { path: 'spec.template.spec.containers[0].volumeMounts[0].mountPath', value: /etc/secrets/onepassword }

  - it: references the env secret once
    asserts:
      - equal:
          path: 'spec.template.spec.containers[0].envFrom'
          value: [{ secretRef: { name: shop-onepassword-env } }]

  - it: wires nothing when external-secrets itself is disabled
    set: { external-secrets.enabled: false }
    asserts:
      - notExists: { path: 'spec.template.spec.containers[0].envFrom' }
      - notExists: { path: spec.template.spec.volumes }

  - it: needs only external-secrets.enabled (1Password is on by default)
    values: [values/one-flag.yaml]
    asserts:
      - equal:
          path: 'spec.template.spec.containers[0].envFrom'
          value: [{ secretRef: { name: shop-onepassword-env } }]

  - it: wires nothing when 1Password is switched off
    set: { external-secrets.onepassword.enabled: false }
    asserts:
      - notExists: { path: 'spec.template.spec.containers[0].envFrom' }

  - it: adds the Reloader annotation when asked
    set: { workload.reloadOnSecretChange: true }
    asserts:
      - equal:
          path: 'metadata.annotations["secret.reloader.stakater.com/reload"]'
          value: shop-onepassword-env,shop-onepassword-files
