external-secrets:
  enabled: true
  onepassword:
    secrets:
      - envVars: [{ secretKey: db, mappings: { DB_PASS: password } }]
      - envVars: [{ secretKey: api, mappings: { API_KEY: key } }]
        files: [{ secretKey: tls, mappings: { tls.crt: cert } }]
      - files: [{ secretKey: ca, mappings: { ca.crt: cert } }]
