suite: availability and scaling
release:
  name: shop
tests:
  - it: renders no PodDisruptionBudget by default
    templates: [templates/pdb.yaml]
    asserts:
      - hasDocuments: { count: 0 }

  - it: uses maxUnavailable 1 when enabled
    templates: [templates/pdb.yaml]
    set: { podDisruptionBudget.enabled: true }
    asserts:
      - isKind: { of: PodDisruptionBudget }
      - equal: { path: spec.maxUnavailable, value: 1 }
      - equal:
          path: spec.selector.matchLabels
          value: { app.kubernetes.io/name: shop, app.kubernetes.io/instance: shop }

  - it: lets minAvailable win
    templates: [templates/pdb.yaml]
    set: { podDisruptionBudget: { enabled: true, minAvailable: "50%" } }
    asserts:
      - equal: { path: spec.minAvailable, value: "50%" }
      - notExists: { path: spec.maxUnavailable }

  - it: renders an HPA and drops replicas from the workload
    templates: [templates/hpa.yaml, templates/workload.yaml]
    set: { autoscaling.enabled: true }
    asserts:
      - isKind: { of: HorizontalPodAutoscaler }
        template: templates/hpa.yaml
      - equal: { path: spec.scaleTargetRef.kind, value: Deployment }
        template: templates/hpa.yaml
      - equal: { path: 'spec.metrics[0].resource.target.averageUtilization', value: 80 }
        template: templates/hpa.yaml
      - notExists: { path: spec.replicas }
        template: templates/workload.yaml

  - it: targets the StatefulSet when that's the workload type
    templates: [templates/hpa.yaml]
    set: { autoscaling.enabled: true, workload.type: StatefulSet }
    asserts:
      - equal: { path: spec.scaleTargetRef.kind, value: StatefulSet }

  - it: fails when minReplicas is above maxReplicas
    templates: [templates/hpa.yaml]
    set: { autoscaling: { enabled: true, minReplicas: 6, maxReplicas: 3 } }
    asserts:
      - failedTemplate: { errorPattern: "must not be greater than maxReplicas" }

  - it: fails on a CPU target without a CPU request
    templates: [templates/hpa.yaml]
    set: { autoscaling.enabled: true, workload.resources: { requests: { cpu: null } } }
    asserts:
      - failedTemplate: { errorPattern: "needs workload.resources.requests.cpu" }

  - it: fails when minAvailable would block every eviction
    templates: [templates/pdb.yaml]
    set: { podDisruptionBudget: { enabled: true, minAvailable: 2 } }
    asserts:
      - failedTemplate: { errorPattern: "must be lower than workload.replicas" }

  - it: spreads pods with the preset and fills in the selector
    templates: [templates/workload.yaml]
    set: { topologySpread.enabled: true, priorityClassName: high }
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector: { matchLabels: { app.kubernetes.io/name: shop, app.kubernetes.io/instance: shop } }
      - equal: { path: spec.template.spec.priorityClassName, value: high }

  - it: spreads pods across nodes by default, as a preference
    templates: [templates/workload.yaml]
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway

  - it: renders no spread constraints when turned off
    templates: [templates/workload.yaml]
    set: { topologySpread.enabled: false }
    asserts:
      - notExists: { path: spec.template.spec.topologySpreadConstraints }

  - it: warns in NOTES about a single replica
    templates: [templates/NOTES.txt]
    set: { workload.replicas: 1 }
    asserts:
      - matchRegexRaw: { pattern: 'WARNING: workload.replicas is 1\.' }
      - matchRegexRaw: { pattern: 'Use at least 2; 3 for high availability' }

  - it: notes that 2 replicas is the minimum, not high availability
    templates: [templates/NOTES.txt]
    asserts:
      - matchRegexRaw: { pattern: 'NOTE: workload.replicas is 2' }
      - notMatchRegexRaw: { pattern: 'WARNING' }

  - it: prints no replica note from 3 replicas with spread on
    templates: [templates/NOTES.txt]
    set: { workload.replicas: 3 }
    asserts:
      - notMatchRegexRaw: { pattern: 'replicas is|WARNING' }

  - it: checks autoscaling.minReplicas instead of replicas
    templates: [templates/NOTES.txt]
    set: { workload.replicas: 5, autoscaling: { enabled: true, minReplicas: 1, targetCPUUtilizationPercentage: 80 } }
    asserts:
      - matchRegexRaw: { pattern: 'WARNING: autoscaling.minReplicas is 1\.' }

  - it: warns when nothing spreads the pods across nodes
    templates: [templates/NOTES.txt]
    set: { workload.replicas: 3, topologySpread.enabled: false }
    asserts:
      - matchRegexRaw: { pattern: 'WARNING: topologySpread is off' }

  - it: accepts pod anti-affinity in place of the spread preset
    templates: [templates/NOTES.txt]
    set:
      workload.replicas: 3
      topologySpread.enabled: false
      affinity: { podAntiAffinity: { preferredDuringSchedulingIgnoredDuringExecution: [] } }
    asserts:
      - notMatchRegexRaw: { pattern: 'topologySpread is off' }
