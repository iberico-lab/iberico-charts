# Default values for the `app` chart.
#
# Everything here has a working default: set only what you want to change.
# Every setting is explained in docs/values-reference.md, and unknown keys are
# rejected by values.schema.json, so typos fail loudly.

# Shared with every chart in this repo.
global:
  name: ""  # base name for all resources; "" = the Helm release name

# Secrets from 1Password, as env vars or files (docs/external-secrets.md).
external-secrets:
  enabled: false
  onepassword: {}

# URLs via Tailscale (private) or Traefik (public) (docs/ingress.md).
ingress:
  enabled: false

# What to run (docs/workload.md).
workload:
  enabled: true
  type: "Deployment"  # or "StatefulSet"
  annotations: {}
  # Restart pods when their 1Password secrets change (needs Stakater Reloader
  # installed in the cluster: https://github.com/stakater/Reloader).
  reloadOnSecretChange: false
  image:
    repository: nginx
    tag: "1.25"
    pullPolicy: IfNotPresent
  replicas: 2
  applicationPort: 80

  # Explicit container ports; empty = single port from applicationPort.
  # Each entry: { name, port, protocol }
  ports: []
  # ports:
  #   - name: http
  #     port: 8080
  #     protocol: TCP

  # Main container command (empty = inherit image defaults)
  command: []
  # Main container args (empty = inherit image defaults)
  args: []

  pod:
    annotations: {}
    labels: {}  # extra pod labels; can't override the chart's own labels

  # Plain (non-secret) environment variables as KEY: value
  environment: {}
  # Raw env entries, copied as-is (use for valueFrom: fieldRef, secretKeyRef...)
  extraEnv: []
  # Raw envFrom entries, copied as-is (load a whole ConfigMap or Secret)
  extraEnvFrom: []
  # Mount existing ConfigMaps, Secrets, emptyDirs or PVCs (docs/volumes.md)
  volumes: []

  # Container lifecycle hooks, copied as-is (postStart / preStop)
  lifecycle: {}

  # Sidecar containers rendered verbatim; each entry MUST define a unique `name`
  extraContainers: []
  # extraContainers:
  #   - name: metrics-exporter
  #     image: prom/statsd-exporter:latest
  #     ports:
  #       - name: metrics
  #         containerPort: 9102

  # Init containers rendered verbatim; each entry MUST define a unique `name`
  extraInitContainers: []
  # extraInitContainers:
  #   - name: wait-for-db
  #     image: busybox:1.36
  #     command: ["sh", "-c", "until nc -z db 5432; do sleep 2; done"]

  # Resources
  resources:
    requests:
      cpu: "300m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "800Mi"

  # Health checks (docs/probes.md). Set only the fields you want to change.
  livenessProbe:
    enabled: true
    type: "http"
    path: "/"
    # host: ""            # optional http host
    # scheme: ""          # optional http scheme (HTTP/HTTPS)
    # httpHeaders: []     # optional http headers
    # command: []         # exec probe command (type: "exec")
    # spec: {}            # used verbatim when custom: true
    custom: false
    port: null            # null => use workload.applicationPort
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1

  readinessProbe:
    enabled: true
    type: "http"
    path: "/"
    # host: ""            # optional http host
    # scheme: ""          # optional http scheme (HTTP/HTTPS)
    # httpHeaders: []     # optional http headers
    # command: []         # exec probe command (type: "exec")
    # spec: {}            # used verbatim when custom: true
    custom: false
    port: null            # null => use workload.applicationPort
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1

  startupProbe:
    enabled: true
    type: "http"
    path: "/"
    # host: ""            # optional http host
    # scheme: ""          # optional http scheme (HTTP/HTTPS)
    # httpHeaders: []     # optional http headers
    # command: []         # exec probe command (type: "exec")
    # spec: {}            # used verbatim when custom: true
    custom: false
    port: null            # null => use workload.applicationPort
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
    successThreshold: 1

  # Deployment-specific rolling update strategy
  strategy:  # Only used for Deployment type
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  # StatefulSet-specific configuration
  serviceName: ""  # Optional: custom name for headless service (defaults to app-name-cluster)
  # StatefulSet only: "OrderedReady" (Kubernetes default, one pod at a time)
  # or "Parallel" (start/stop all pods at once). Empty = Kubernetes default.
  podManagementPolicy: ""
  updateStrategy:  # Optional: StatefulSet update strategy
    type: RollingUpdate
  terminationGracePeriodSeconds: 30  # Seconds pods get to shut down (Deployment and StatefulSet)

# Stable address inside the cluster (docs/service.md).
service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: null  # null => use workload.applicationPort
  # Name of the single port (container, Service and headless Service), e.g.
  # "postgres". Max 15 chars. Ignored when service.ports / workload.ports are set.
  portName: http
  annotations: {}
  # StatefulSet only: the headless Service that gives each pod its own address.
  # (Replaces workload.service, which still works as a deprecated alias.)
  headless:
    annotations: {}
    port: null        # null => use workload.applicationPort
    targetPort: null  # null => use workload.applicationPort
    ports: []

# Kubernetes identity for the pods (docs/security.md).
serviceAccount:
  create: false
  # Mount a Kubernetes API token into the pods. Most apps don't talk to the
  # API, so it's off by default; set true if yours does.
  automount: false
  name: ""
  annotations: {}

# Prometheus scraping via a ServiceMonitor (needs the Prometheus Operator CRDs).
metrics:
  serviceMonitor:
    enabled: false
    port: ""          # Service port NAME to scrape; "" = the first/only port
    path: /metrics
    interval: 30s
    scrapeTimeout: ""
    labels: {}        # e.g. { release: kube-prometheus-stack } so Prometheus finds it

# Scale the number of pods with CPU/memory use (HorizontalPodAutoscaler).
# When enabled, workload.replicas is ignored. Needs metrics-server in the cluster.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80     # % of workload.resources.requests.cpu
  targetMemoryUtilizationPercentage: null
  behavior: {}                            # optional scale up/down tuning, copied as-is

# Keep some pods running during voluntary disruptions (node drains, upgrades).
# minAvailable wins when set; otherwise maxUnavailable is used. Numbers or "50%".
podDisruptionBudget:
  enabled: false
  minAvailable: null
  maxUnavailable: 1

# Disks the chart creates: PVCs for a Deployment, one per pod for a StatefulSet
# (docs/persistence.md). Each entry: name, size, mountPath (+ accessModes,
# storageClassName, readOnly, annotations). accessModes default: ReadWriteOnce.
persistence: []

# Pod Security Context. Safe defaults that work with any image; see
# docs/security.md for the stricter opt-in settings. Set a key to null to drop it.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# Container Security Context (main container)
securityContext:
  allowPrivilegeEscalation: false

# Spread pods across nodes (or zones) so one failure doesn't take them all.
# The selector is filled in for you.
topologySpread:
  enabled: false
  topologyKey: kubernetes.io/hostname   # or topology.kubernetes.io/zone
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway      # or DoNotSchedule (strict)

# Raw topologySpreadConstraints, copied as-is (added after the preset above)
topologySpreadConstraints: []

# PriorityClass for the pods (must already exist in the cluster)
priorityClassName: ""

# Where pods may run, copied as-is
nodeSelector: {}
affinity: {}
tolerations: []

# Login details for private registries, e.g. [{name: my-registry}]
imagePullSecrets: []

# `helm test <release>` support: a pod that checks every Service port accepts
# connections (plain TCP, so it works for HTTP apps and databases alike).
helmTest:
  enabled: true
  image: busybox:1.36

# Extra Kubernetes objects to ship with the release (maps or strings).
# Each is passed through `tpl`, so template expressions work, e.g.
#   - apiVersion: v1
#     kind: ConfigMap
#     metadata:
#       name: '{{ include "helm-helpers.fullname" . }}-settings'
#     data:
#       mode: production
extraManifests: []
