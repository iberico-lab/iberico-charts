apiVersion: v2
name: app
description: A Helm chart for application deployment with secret and volume management
type: application
version: 0.3.0
kubeVersion: ">=1.30.0-0"
keywords:
  - app
  - deployment
  - secrets
  - ingress
home: https://github.com/alexbaeza/iberico-charts
sources:
  - https://github.com/alexbaeza/iberico-charts
maintainers:
  - name: Iberico Lab

dependencies:
  - name: helm-helpers
    version: "0.3.0"
    repository: "file://../helm-helpers"
  - name: external-secrets
    version: "0.3.0"
    repository: "file://../external-secrets"
    condition: external-secrets.enabled
  - name: ingress
    version: "0.3.0"
    repository: "file://../ingress"
    condition: ingress.enabled
