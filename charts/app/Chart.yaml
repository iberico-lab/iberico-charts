apiVersion: v2
name: app
description: A Helm chart for application deployment with secret and volume management
type: application
version: 0.2.0
appVersion: "1.0.0"
keywords:
  - app
  - deployment
  - secrets
  - ingress
home: https://github.com/iberico-lab/iberico-charts
sources:
  - https://github.com/iberico-lab/iberico-charts
maintainers:
  - name: Iberico Lab
    email: team@iberico-lab.com

dependencies:
  - name: helm-helpers
    version: "0.2.0"
    repository: "file://../helm-helpers"
  - name: external-secrets
    version: "0.2.0"
    repository: "file://../external-secrets"
    condition: external-secrets.enabled
  - name: ingress
    version: "0.2.0"
    repository: "file://../ingress"
    condition: ingress.enabled
