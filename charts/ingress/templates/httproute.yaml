{{/*
Gateway API HTTPRoutes: the successor to Ingress. Each route has a `type`
(internal, public, public-sso) that the environment configures once in
ingress.types: which Gateway it attaches to, and which Traefik Middlewares
run (the login first, then the route's own `middlewares`, then its raw
`filters`). TLS is set on the Gateway's listener, not here.
*/}}
{{- $appName := include "helm-helpers.fullname" . }}
{{- range $i, $route := .Values.httpRoutes }}
{{- $where := printf "ingress.httpRoutes[%d]" $i }}
{{- $typeGw := (get ($.Values.types | default dict) $route.type | default dict).gateway | default dict }}
{{- /* An internal route never falls back to ingress.gateway: that is usually the public one. */}}
{{- $defaultGw := ternary dict ($.Values.gateway | default dict) (eq $route.type "internal") }}
{{- $gw := merge (deepCopy ($route.gateway | default dict)) (deepCopy $typeGw) (deepCopy $defaultGw) }}
{{- $gwName := required (ternary (printf "%s is type internal: set ingress.types.internal.gateway.name to the Gateway only your private network can reach (internal routes never use ingress.gateway)" $where) (printf "%s: set gateway.name (here, in ingress.types.%s.gateway, or in ingress.gateway) to the Gateway this route attaches to" $where $route.type) (eq $route.type "internal")) $gw.name }}
{{- $host := include "helm-helpers.routeHost" (dict "route" $route "index" $i "domain" $.Values.domain "name" $appName) }}
{{- $filters := list }}
{{- range include "ingress.middlewares" (dict "entry" $route "where" $where "root" $) | fromYamlArray }}
{{- if contains "@" . }}
{{- fail (printf "%s: middleware %q is a Traefik provider reference; HTTPRoutes can only use a Middleware object in their own namespace, so give its plain name" $where .) }}
{{- end }}
{{- $filters = append $filters (dict "type" "ExtensionRef" "extensionRef" (dict "group" "traefik.io" "kind" "Middleware" "name" .)) }}
{{- end }}
{{- $filters = concat $filters ($route.filters | default list) }}
{{- $homepage := include "helm-helpers.homepageAnnotations" (dict "ingress" (merge (dict "host" $host) (omit $route "host")) "group" (include "ingress.homepageGroup" $route.type) "root" $) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ingress.routeName" (dict "route" $route "root" $) }}
  namespace: {{ include "helm-helpers.namespace" $ }}
  labels:
    {{- include "helm-helpers.labels" $ | nindent 4 }}
    app.kubernetes.io/component: httproute
  {{- if or $homepage $route.annotations }}
  annotations:
    {{- with $homepage }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- with $route.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ $gwName }}
      {{- with $gw.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with $gw.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $route.path | default "/" }}
      {{- with $filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "ingress.serviceName" (dict "ingress" $route "root" $) }}
          port: {{ $route.servicePort | default 80 }}
{{- end }}
