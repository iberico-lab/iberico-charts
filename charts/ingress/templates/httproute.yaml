{{/*
Gateway API HTTPRoutes: the successor to Ingress. Each route has a `type`
(internal, public, public-sso) that the environment configures once in
ingress.types: its Gateway, hostname domain/suffix, and Traefik Middlewares.
Filters run in order: the type's middlewares (e.g. the login), the route's
own `middlewares`, then its raw `filters`. TLS is set on the Gateway.
*/}}
{{- range $i, $route := .Values.httpRoutes }}
{{- $where := printf "ingress.httpRoutes[%d]" $i }}
{{- $gw := include "ingress.routeGateway" (dict "route" $route "where" $where "root" $) | fromYaml }}
{{- $host := include "ingress.host" (dict "entry" $route "where" $where "root" $) }}
{{- $filters := list }}
{{- range include "ingress.middlewares" (dict "entry" $route "where" $where "root" $) | fromYamlArray }}
{{- if contains "@" . }}
{{- fail (printf "%s: middleware %q is a Traefik provider reference; an HTTPRoute can only use a Middleware in its own namespace, so give its plain name" $where .) }}
{{- end }}
{{- $filters = append $filters (dict "type" "ExtensionRef" "extensionRef" (dict "group" "traefik.io" "kind" "Middleware" "name" .)) }}
{{- end }}
{{- $filters = concat $filters ($route.filters | default list) }}
{{- $group := include "ingress.homepageGroup" $route.type }}
{{- $homepage := include "helm-helpers.homepageAnnotations" (dict "entry" $route "host" $host "group" $group "root" $) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ingress.routeName" (dict "route" $route "root" $) }}
  namespace: {{ include "helm-helpers.namespace" $ }}
  labels:
    {{- include "helm-helpers.labels" $ | nindent 4 }}
    app.kubernetes.io/component: httproute
  {{- if or $homepage $route.annotations }}
  annotations:
    {{- with $homepage }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- with $route.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ $gw.name }}
      {{- with $gw.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with $gw.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $route.path | default "/" }}
      {{- with $filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "ingress.serviceName" (dict "ingress" $route "root" $) }}
          port: {{ $route.servicePort | default 80 }}
{{- end }}
