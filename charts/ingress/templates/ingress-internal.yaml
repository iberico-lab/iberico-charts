{{/*
Internal Ingress - Tailscale-based internal access
Uses the Tailscale ingress class. The machine name (and so the URL
https://<machine>.<tailnet>.ts.net) is `host`, or the app's name.
*/}}
{{- if .Values.ingresses }}
{{- range $i, $ing := .Values.ingresses }}
{{- with $ing }}
{{- if eq .type "internal" }}
{{- $machine := include "ingress.machineName" (dict "ingress" . "root" $ "index" $i) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $machine }}-internal
  namespace: {{ include "helm-helpers.namespace" $ }}
  labels:
    {{- include "helm-helpers.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ingress
  annotations:
    {{- if .tailscaleExpose | default false }}
    tailscale.com/serve: "true"
    {{- end }}
    {{- with include "helm-helpers.homepageAnnotations" (dict "ingress" . "group" "Internal" "root" $) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- with .annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: {{ include "ingress.serviceName" (dict "ingress" . "root" $) }}
      port:
        {{- if .servicePortName }}
        name: {{ .servicePortName }}
        {{- else }}
        number: {{ .servicePort | default 80 }}
        {{- end }}
  # The Tailscale operator names the machine after the first tls host
  # (https://tailscale.com/docs/kubernetes-operator/manage-and-configure/custom-machine-names).
  tls:
    - hosts:
        - {{ $machine }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
