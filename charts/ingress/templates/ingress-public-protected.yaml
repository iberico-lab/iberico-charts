{{/*
Public Protected Ingress - SSO authentication required
Uses Traefik with network-sso middleware
*/}}
{{- if .Values.ingresses }}
{{- range .Values.ingresses }}
{{- if eq .type "public-protected" }}
{{- $host := required (printf "ingress.ingresses[]: type %q requires a host" .type) .host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "helm-helpers.fullname" $ }}-{{ .type }}
  namespace: {{ include "helm-helpers.namespace" $ }}
  labels:
    {{- include "helm-helpers.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ingress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: network-sso@kubernetescrd
    {{- with include "helm-helpers.homepageAnnotations" (dict "ingress" . "group" "Public Protected" "root" $) }}
    {{- . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ingress.serviceName" (dict "ingress" . "root" $) }}
                port:
                  number: {{ .servicePort | default 80 }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ $host }}-tls
---
{{- end }}
{{- end }}
{{- end }}
