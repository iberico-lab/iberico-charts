{{/*
Public Ingresses through Traefik, with HTTPS from cert-manager:
- public      runs ingress.types.public.middlewares (e.g. plain forwarding)
- public-sso  runs ingress.types.public-sso.middlewares (the login; required)
then the entry's own `middlewares`. Middlewares are Traefik Middleware objects
in the app's namespace; a name with "@" (e.g. "auth@file", or
"other-ns-name@kubernetescrd") is passed to Traefik as written.
*/}}
{{- $ns := include "helm-helpers.namespace" . }}
{{- range $i, $ing := .Values.ingresses }}
{{- if has $ing.type (list "public" "public-sso") }}
{{- $host := required (printf "ingress.ingresses[%d]: type %q requires a host" $i $ing.type) $ing.host }}
{{- $refs := list }}
{{- range include "ingress.middlewares" (dict "entry" $ing "where" (printf "ingress.ingresses[%d]" $i) "root" $) | fromYamlArray }}
{{- $refs = append $refs (ternary . (printf "%s-%s@kubernetescrd" $ns .) (contains "@" .)) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "helm-helpers.fullname" $ }}-{{ $ing.type }}
  namespace: {{ $ns }}
  labels:
    {{- include "helm-helpers.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ingress
  annotations:
    {{- with $refs }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," . }}
    {{- end }}
    cert-manager.io/cluster-issuer: {{ $ing.certManagerIssuer | default "letsencrypt-staging" }}
    {{- with include "helm-helpers.homepageAnnotations" (dict "ingress" $ing "group" (include "ingress.homepageGroup" $ing.type) "root" $) }}
    {{- . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ingress.serviceName" (dict "ingress" $ing "root" $) }}
                port:
                  number: {{ $ing.servicePort | default 80 }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ $host }}-tls
{{- end }}
{{- end }}
