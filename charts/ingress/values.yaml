global:
  name: ""

# Your Tailscale tailnet domain (e.g. "tail1234.ts.net"). Only used to print
# the full Tailscale URL in the install notes.
tailnetDomain: ""

# Ingress definitions
# Default internal ingress - name will be generated from helm-helpers
ingresses:
  - serviceName: ""   # backend Service; "" = the app's own Service
    type: "internal"
    host: ""  # Leave empty for defaultBackend approach
    servicePort: 80
    # servicePortName: "https"  # Uncomment for HTTPS backend

# Traefik middlewares attached to public ingresses (traefik.io Middleware
# objects, in the app's namespace). Set to "" for none.
#   public      -> no login, plain forwarding
#   public-sso  -> a forward-auth style middleware that adds SSO
middlewares:
  public: ""       # e.g. "my-no-auth"
  publicSso: ""    # e.g. "my-sso"

# Gateway API routes (HTTPRoute), the successor to Ingress (docs/ingress.md).
# Each entry: host or subdomain (or neither, with domain set), plus name,
# access, path, serviceName, servicePort, gateway, filters, annotations, homepage.
httpRoutes: []
# Base domain for routes without a host, usually set per environment
# (e.g. "apps.example.com"): a route gets "<subdomain or app name>.<domain>".
domain: ""
# The Traefik Middleware behind each route `access` value (in the namespace
# the routes land in). A route with `access: sso` needs sso.middleware set.
accessProfiles:
  public:
    middleware: ""   # e.g. "my-no-auth"; "" = no filter
  sso:
    middleware: ""   # e.g. "my-sso"
# The Gateway every route attaches to, unless a route sets its own `gateway`.
gateway:
  name: ""          # e.g. "traefik-gateway"
  namespace: ""     # "" = the app's namespace
  sectionName: ""   # listener name, e.g. "websecure"; "" = every listener
