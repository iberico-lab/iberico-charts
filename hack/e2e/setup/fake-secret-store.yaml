# Stands in for 1Password in e2e: the External Secrets Operator's built-in
# "fake" provider serves these items, so ExternalSecrets sync for real.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: e2e-fake
spec:
  provider:
    fake:
      data:
        - key: e2e-database
          value: '{"password": "s3cret-from-store"}'
        - key: e2e-tls
          value: '{"certificate": "CERT-FROM-STORE"}'
