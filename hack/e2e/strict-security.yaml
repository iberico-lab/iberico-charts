# The strict opt-in block from docs/security.md, with an image that supports it.
workload:
  replicas: 1
  image: {repository: nginxinc/nginx-unprivileged, tag: "1.27-alpine"}
  applicationPort: 8080
  volumes:
    - {name: tmp, mountPath: /tmp, emptyDir: {}}
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  fsGroup: 101
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: ["ALL"]}
