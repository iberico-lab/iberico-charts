# ----------------------------------------------
# workload:
#   enabled: true
#   type: "StatefulSet"
#   image:
#     repository: elasticsearch
#     tag: "8.11.0"
#   replicas: 3
#   applicationPort: 9200
#   serviceName: "elasticsearch-cluster"
#   environment:
#     node.name: "${POD_NAME}"
#     cluster.name: "elasticsearch-cluster"
#     discovery.seed_hosts: "elasticsearch-cluster"
#     cluster.initial_master_nodes: "elasticsearch-0,elasticsearch-1,elasticsearch-2"
#     "ES_JAVA_OPTS": "-Xms1g -Xmx1g"
#   resources:
#     requests:
#       cpu: "1000m"
#       memory: "2Gi"
#     limits:
#       cpu: "2000m"
#       memory: "4Gi"
# 
# persistence:
#   - name: data
#     size: 100Gi
#     accessModes: ["ReadWriteOnce"]
#     storageClassName: "opendrive"
#     mountPath: /usr/share/elasticsearch/data
#
# Example 6: Probes — partial override, custom probe, command/args
# ----------------------------------------------------------------
# Probes support PARTIAL overrides: any field you omit inherits its
# values.yaml default via Helm's native map coalescing.
# workload:
#   enabled: true
#   type: "Deployment"
#   image:
#     repository: nginx
#     tag: "1.25"
#   applicationPort: 8080
#
#   # Override ONLY one probe field; type/path/port stay default.
#   readinessProbe:
#     periodSeconds: 15
#
#   # Custom probe: `spec` is emitted verbatim (custom: true).
#   livenessProbe:
#     custom: true
#     spec:
#       httpGet:
#         path: /live
#         port: 8080
#       initialDelaySeconds: 10
#       periodSeconds: 20
#
#   # Disable a probe entirely.
#   startupProbe:
#     enabled: false
#
#   # Main container command/args (empty [] = inherit image defaults).
#   command: ["/bin/sh"]
#   args: ["-c", "exec nginx -g 'daemon off;'"]
#
# Example 7: Sidecars + init containers
# -------------------------------------
# extraContainers / extraInitContainers render VERBATIM into the pod.
# Each entry MUST define `name` (render fails loud otherwise).
# workload:
#   enabled: true
#   type: "Deployment"
#   image:
#     repository: my-app
#     tag: "1.0.0"
#   applicationPort: 8080
#
#   extraInitContainers:
#     - name: wait-for-db
#       image: busybox:1.36
#       command: ["sh", "-c", "until nc -z db 5432; do sleep 2; done"]
#
#   extraContainers:
#     - name: metrics-exporter
#       image: prom/statsd-exporter:latest
#       ports:
#         - name: metrics
#           containerPort: 9102
