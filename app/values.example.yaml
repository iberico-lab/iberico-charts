# Examples for different workload types
# =====================================
#
# Example 1: Simple Web App (Deployment)
# --------------------------------------
# workload:
#   enabled: true
#   type: "Deployment"
#   image:
#     repository: nginx
#     tag: "1.25"
#   replicas: 3
#   applicationPort: 80
#   livenessProbe:
#     path: /healthz
#   readinessProbe:
#     path: /healthz
#   strategy:
#     type: RollingUpdate
#     rollingUpdate:
#       maxUnavailable: 1
#       maxSurge: 1
# 
# service:
#   enabled: true
#   type: ClusterIP
#   port: 80
#   targetPort: 80
#
# Example 2: Database (StatefulSet)
# ---------------------------------
# workload:
#   enabled: true
#   type: "StatefulSet"
#   image:
#     repository: postgres
#     tag: "15"
#   replicas: 1
#   applicationPort: 5432
#   serviceName: "postgres-cluster"
#   updateStrategy:
#     type: RollingUpdate
#   terminationGracePeriodSeconds: 30
#   environment:
#     POSTGRES_DB: "mydb"
#     POSTGRES_USER: "user"
#     POSTGRES_PASSWORD: "password"
# 
# persistence:
#   - name: data
#     size: 10Gi
#     accessModes: ["ReadWriteOnce"]
#     storageClassName: "opendrive"
#     mountPath: /var/lib/postgresql/data
#
# Example 3: Redis Cache (Deployment with PVC)
# --------------------------------------------
# workload:
#   enabled: true
#   type: "Deployment"
#   image:
#     repository: redis
#     tag: "7"
#   replicas: 2
#   applicationPort: 6379
#   environment:
#     REDIS_PASSWORD: "password"
#   resources:
#     requests:
#       cpu: "100m"
#       memory: "128Mi"
#     limits:
#       cpu: "500m"
#       memory: "256Mi"
# 
# persistence:
#   - name: data
#     size: 4Gi
#     accessModes: ["ReadWriteMany"]
#     storageClassName: "opendrive"
#     mountPath: /data
#
