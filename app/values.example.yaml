#     MONGO_INITDB_ROOT_PASSWORD: "password"
#   resources:
#     requests:
#       cpu: "200m"
#       memory: "512Mi"
#     limits:
#       cpu: "1000m"
#       memory: "2Gi"
#   serviceName: "mongo-cluster"
# 
# persistence:
#   - name: data
#     size: 50Gi
#     accessModes: ["ReadWriteOnce"]
#     storageClassName: "opendrive"
#     mountPath: /data/db
