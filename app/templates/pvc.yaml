{{- if and (.Values.workload.enabled | default false) (eq (.Values.workload.type | default "Deployment") "Deployment") -}}
{{- range .Values.persistence }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-%s" (include "helm-helpers.fullname" $) .name }}
  namespace: {{ include "helm-helpers.namespace" $ }}
  labels:
    {{- include "helm-helpers.labels" $ | nindent 4 }}
    app.kubernetes.io/component: pvc
  annotations:
    {{- if .annotations }}
    {{- toYaml .annotations | nindent 4 }}
    {{- end }}
    {{- if eq (.storageClassName | default "") "opendrive" }}
    csi-rclone/storage-path: {{ if .rclone }}{{ .rclone.storagePath | default (include "helm-helpers.fullname" $) }}{{ else }}{{ include "helm-helpers.fullname" $ }}{{ end }}
    csi-rclone/umask: {{ if .rclone }}{{ .rclone.umask | default "022" | quote }}{{ else }}"022"{{ end }}
    {{- if .rclone }}
    {{- if .rclone.annotations }}
    {{- toYaml .rclone.annotations | nindent 4 }}
    {{- end }}
    {{- end }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml (.accessModes | default (list "ReadWriteMany")) | nindent 4 }}
  resources:
    requests:
      storage: {{ .size }}
  {{- if .storageClassName }}
  storageClassName: {{ .storageClassName }}
  {{- end }}
{{- end }}
{{- end }}
