{{- define "app.deployment" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm-helpers.fullname" . }}
  namespace: {{ include "helm-helpers.namespace" . }}
  labels:
    {{- include "helm-helpers.labels" . | nindent 4 }}
  {{- with .Values.workload.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.workload.replicas }}
  {{- if .Values.workload.strategy }}
  strategy:
    {{- toYaml .Values.workload.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "helm-helpers.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.workload.pod.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "helm-helpers.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        {{- include "app.container" . | nindent 8 }}
        {{- if .Values.workload.extraContainers }}
        {{- include "app.extraContainers" . | nindent 8 }}
        {{- end }}
      {{- if .Values.workload.extraInitContainers }}
      initContainers:
        {{- include "app.initContainers" . | nindent 8 }}
      {{- end }}
      {{- $hasFilesVolumes := false }}
{{- if and (index .Values "external-secrets") (index .Values "external-secrets" "onepassword") (index .Values "external-secrets" "onepassword" "enabled") (index .Values "external-secrets" "onepassword" "secrets") }}
{{- range (index .Values "external-secrets" "onepassword" "secrets") }}
      {{- if .files }}
      {{- $hasFilesVolumes = true }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if or .Values.workload.volumes .Values.persistence $hasFilesVolumes }}
      volumes:
        {{- include "app.volume" . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
