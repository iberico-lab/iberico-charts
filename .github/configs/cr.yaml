# Chart Releaser (cr) configuration.
#
# Passed explicitly by the release workflow via
# `config: .github/configs/cr.yaml`.
#
# Primary distribution: GitHub Releases + `gh-pages` branch chart repository.

# Branch that hosts the generated index.yaml and chart packages.
pages-branch: gh-pages

# Name pattern for the GitHub Release that holds each chart version.
release-name-template: "{{ .Name }}-{{ .Version }}"

# Mark the most recent chart release as "latest".
make-release-latest: true

# Re-running the workflow must not fail on already-published versions.
skip-existing: true
