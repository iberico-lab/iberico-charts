name: Lint Charts

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  HELM_VERSION: v3.22.1
  # Oldest Kubernetes the charts support; keep in step with kubeVersion in charts/*/Chart.yaml.
  MIN_KUBE_VERSION: 1.30.9

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `ct` detects changed charts against the target branch.
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      # Resolve `file://` sub-chart dependencies before linting.
      - name: Update chart dependencies
        run: make deps

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Check values schemas are up to date
        run: make schema-check

      - name: Check every setting is documented
        run: make docs-check

      - name: Check all charts share one version
        run: make version-check

      - name: Run chart-testing (lint)
        run: ct lint --config .github/configs/ct.yaml --all

      # Lint every chart explicitly, independent of change detection.
      - name: Run helm lint on all charts
        run: make lint

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.6.3

      - name: Run unit tests
        run: make test

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Validate rendered manifests against Kubernetes schemas
        run: make validate

      - name: Validate against the oldest supported Kubernetes
        run: make validate KUBE_VERSION=${{ env.MIN_KUBE_VERSION }}

      # Every example must keep rendering against the app chart.
      - name: Render all examples
        run: make examples

  e2e:
    # Install the charts on a real (throwaway) cluster and run `helm test`:
    # the oldest supported Kubernetes, a middle one and the newest, with Helm 3,
    # plus the newest with Helm 4.
    name: e2e (Kubernetes ${{ matrix.kube }}, Helm ${{ matrix.helm }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kube: v1.30.13, helm: v3.22.1 }
          - { kube: v1.34.11, helm: v3.22.1 }
          - { kube: v1.37.0, helm: v3.22.1 }
          - { kube: v1.37.0, helm: v4.3.1 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ matrix.helm }}

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          node_image: kindest/node:${{ matrix.kube }}

      - name: Install, test, upgrade and uninstall every scenario
        run: make e2e
