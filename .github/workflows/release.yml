name: Release Charts

# Publishes all four charts to GitHub Container Registry as OCI artifacts:
#   oci://ghcr.io/alexbaeza/charts/<chart>:<version>
# and creates a GitHub Release with the packages and the CHANGELOG notes.
#
# How to release (see docs/versioning.md#release-checklist):
#   make bump VERSION=x.y.z, date the CHANGELOG, merge to main, then
#   git tag vx.y.z && git push origin vx.y.z

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to ghcr.io
  id-token: write   # keyless cosign signing

env:
  HELM_VERSION: v3.22.1
  REGISTRY: ghcr.io/${{ github.repository_owner }}/charts
  # Dependencies first, so the app package bundles freshly built subcharts.
  CHARTS: helm-helpers external-secrets ingress app

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Check the tag matches the chart version
        run: |
          make version-check
          version=$(awk '/^version:/ {print $2; exit}' charts/app/Chart.yaml)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} doesn't match chart version ${version}: tag v${version}, or run make bump"
            exit 1
          fi
          if grep -q "^## \[${version}\] - unreleased" CHANGELOG.md; then
            echo "::error::CHANGELOG.md still says ${version} is unreleased: put today's date there first"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Package the charts
        run: |
          make deps
          mkdir -p dist
          for c in $CHARTS; do helm package "charts/$c" -d dist; done

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Published versions are never overwritten: a version means one exact package.
      - name: Push to ghcr.io
        run: |
          : > digests.txt
          for c in $CHARTS; do
            if helm show chart "oci://${REGISTRY}/${c}" --version "${VERSION}" >/dev/null 2>&1; then
              echo "::error::${c} ${VERSION} is already published. Bump the version instead"
              exit 1
            fi
            out=$(helm push "dist/${c}-${VERSION}.tgz" "oci://${REGISTRY}" 2>&1) || { echo "$out"; exit 1; }
            echo "$out"
            echo "${REGISTRY}/${c}@$(echo "$out" | awk '/^Digest:/ {print $2}')" >> digests.txt
          done

      # Keyless signing records the repo and workflow in the public Sigstore
      # transparency log, so it only runs for public repositories.
      - name: Install cosign
        if: ${{ !github.event.repository.private }}
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the charts
        if: ${{ !github.event.repository.private }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          while read -r ref; do cosign sign --yes "$ref"; done < digests.txt

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # the CHANGELOG section for this version, without its heading
          awk -v v="${VERSION}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "Install: \`helm install <release> oci://${REGISTRY}/app --version ${VERSION}\`"
          } >> notes.md
          gh release create "${GITHUB_REF_NAME}" dist/*.tgz --title "${GITHUB_REF_NAME}" --notes-file notes.md
