name: Release Charts

# Publishes the charts as a Helm repository on GitHub Pages:
#   helm repo add iberico https://iberico-lab.github.io/iberico-charts
#   helm repo update
#   helm install my-app iberico/app --version x.y.z
#
# Each tag also creates a GitHub Release carrying that version's .tgz files.
# Those release assets are the source of truth: the index is rebuilt from all of
# them on every run, so earlier versions stay installable.
#
# How to release (see docs/versioning.md#release-checklist):
#   make bump VERSION=x.y.z, date CHANGELOG, merge to main,
#   git tag vx.y.z && git push origin vx.y.z
#
# GitHub Pages sites are always public on the free org plan, so the deploy job
# runs only from a public repository. If you tag while it is private, the
# Release and its .tgz files are still created and the run says the site was
# skipped; publish it later with "Run workflow" and the tag as input.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)publish, e.g. v0.3.0"
        required: true
        type: string

permissions:
  contents: write # GitHub Release + download earlier release assets
  pages: write # deploy the chart repository
  id-token: write # Pages deployment

env:
  HELM_VERSION: v3.22.1
  # Where the chart repository is served. Must match the Pages site URL.
  PAGES_URL: https://iberico-lab.github.io/iberico-charts
  # Dependencies first: the app bundle is built from the sub-charts.
  CHARTS: helm-helpers external-secrets ingress app

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          # A push provides the tag; a manual run names it.
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Resolve the tag and version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          echo "public=${{ !github.event.repository.private }}" >> "$GITHUB_OUTPUT"

          make version-check
          version=$(awk '/^version:/ {print $2; exit}' charts/app/Chart.yaml)
          if [ "${tag}" != "v${version}" ]; then
            echo "::error::tag ${tag} doesn't match chart version ${version}: tag v${version}, or run make bump"
            exit 1
          fi
          if grep -q "^## \[${version}\] - unreleased" CHANGELOG.md; then
            echo "::error::CHANGELOG.md still says ${version} is unreleased: put today's date there first"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

          # A published version is never overwritten: one version, one package.
          # Re-publishing an existing tag is only allowed as an explicit manual
          # run (that is how a private repo's release gets its Pages site later).
          if gh release view "${tag}" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::release ${tag} already exists. Bump the version instead"
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} is already released; reusing its assets and republishing the site"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package the charts
        run: |
          make deps
          mkdir -p pkg
          for c in $CHARTS; do helm package "charts/$c" -d pkg; done
          ls -l pkg

      # index.yaml must list every published version, not just this one, so it
      # is rebuilt from the .tgz files attached to all earlier releases.
      - name: Build the chart repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site
          cp pkg/*.tgz site/
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            echo "==> $tag"
            gh release download "$tag" --pattern '*.tgz' --dir site --clobber || true
          done
          # Not strictly needed for Actions-based deploys, but it keeps the site
          # correct if it is ever served from a branch, where Jekyll applies.
          touch site/.nojekyll
          helm repo index site --url "${PAGES_URL}/"
          echo "--- index.yaml ---"
          head -40 site/index.yaml

      - name: Create the GitHub Release
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # the CHANGELOG section for this version, without its heading
          awk -v v="${VERSION}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          {
            echo
            echo '```bash'
            echo "helm repo add iberico ${PAGES_URL}"
            echo "helm repo update"
            echo "helm install <release> iberico/app --version ${VERSION}"
            echo '```'
          } >> notes.md
          gh release create "${TAG}" pkg/*.tgz \
            --title "${TAG}" \
            --notes-file notes.md

      - name: Keep the repository for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: chart-repository
          path: site

      # Fail loudly rather than leave a release that nobody can install from.
      - name: Note that the Pages deploy was skipped
        if: steps.check.outputs.public != 'true'
        run: |
          echo "::warning::The repository is private, so GitHub Pages was not deployed (Pages sites are always public on the free plan)."
          echo "::warning::Charts are attached to release ${TAG}, but 'helm repo add' will not work yet."
          echo "::warning::Make the repository public, then run this workflow manually with tag=${TAG} to publish the site."

  deploy:
    needs: release
    if: needs.release.outputs.public == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - name: Download the chart repository
        uses: actions/download-artifact@v4
        with:
          name: chart-repository
          path: site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
