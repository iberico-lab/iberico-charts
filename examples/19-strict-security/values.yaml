# 19 - Strict security: non-root, read-only, no capabilities.
# Tested on a real cluster by `make e2e`.
global:
  name: "secure-demo"

workload:
  image:
    repository: nginxinc/nginx-unprivileged    # an image built to run as non-root
    tag: "1.27-alpine"
  applicationPort: 8080
  volumes:
    - name: tmp                                # the only writable folder
      mountPath: /tmp
      emptyDir: {}

service:
  port: 80                                     # other apps still use port 80

# Non-root, no privilege escalation, all capabilities dropped, seccomp on:
# what Kubernetes' "restricted" Pod Security Standard requires.
securityPreset: restricted

podSecurityContext:
  runAsUser: 101           # the user this image is built for
  runAsGroup: 101
  fsGroup: 101             # lets that user write to mounted disks

securityContext:
  readOnlyRootFilesystem: true   # not required by the standard, but safer

# Only pods in this namespace and the ingress controller may connect.
networkPolicy:
  enabled: true
  allowNamespaces: [traefik]
