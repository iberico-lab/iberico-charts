# 03 - Environment Variables
# Plain (non-secret) environment variables injected into the main container.
global:
  name: "env-app"

workload:
  enabled: true
  type: "Deployment"
  image:
    repository: nginx
    tag: "1.25"
  replicas: 1
  applicationPort: 80

  # Rendered as env: [{name, value}] entries (values are quoted).
  environment:
    NODE_ENV: "production"
    LOG_LEVEL: "info"
    APP_PORT: "80"

service:
  enabled: true
