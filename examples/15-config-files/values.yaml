# 15 - Config files
# Write config files in your values. Path on the left, contents on the right.
global:
  name: "config-demo"

workload:
  image:
    repository: nginx
    tag: "1.27"
  replicas: 1
  configFiles:
    # Replaces only this one file; nginx's other config stays as it is.
    /etc/nginx/conf.d/default.conf: |
      server {
        listen 80;
        location /        { root /usr/share/nginx/html; }
        location /healthz { return 200 "ok"; }
      }
  # Health checks can now use the endpoint the config file adds.
  livenessProbe:  { path: /healthz }
  readinessProbe: { path: /healthz }
  startupProbe:   { path: /healthz }
