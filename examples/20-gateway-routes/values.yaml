# 20 - Gateway API routes, one values file for every environment
# The app picks a type for each URL (internal, public, public-sso) and never
# names a hostname, Gateway or Traefik Middleware. Those come from the
# environment (set inline here so the example renders on its own; in practice
# pass them in a second values file, e.g. `-f values.yaml -f env/staging.yaml`).
global:
  name: "shop"

workload:
  image:
    repository: nginx
    tag: "1.25"
  applicationPort: 80

ingress:
  enabled: true                          # no `ingresses`: only routes

  # --- per environment ---------------------------------------------------
  domain: "staging.example.com"          # routes become <name>.staging.example.com
  gateway:                               # default Gateway (the public one)
    name: "traefik-gateway"
    namespace: "traefik"
    sectionName: "websecure"
  types:
    internal:
      domain: "internal.staging.example.com"  # your own zone, resolving to the
      gateway:                                # private Gateway (e.g. exposed on
        name: "private-gateway"               # your tailnet)
        namespace: "traefik"
    public:
      middlewares: []                    # plain forwarding
    public-sso:
      middlewares: ["my-sso"]            # the login, always run first

  # --- per app -----------------------------------------------------------
  httpRoutes:
    # shop.staging.example.com, anyone can open it
    - type: public
      homepage:
        name: "Shop"
        icon: "kubernetes"
    # admin.staging.example.com/admin: login first, then the app's own middleware
    - name: shop-admin
      type: public-sso
      subdomain: admin
      path: /admin
      middlewares: ["shop-admin-headers"]
      homepage:
        enabled: false                   # keep it off the dashboard
    # ops.internal.staging.example.com, private network only
    - name: shop-ops
      type: internal
      subdomain: ops
