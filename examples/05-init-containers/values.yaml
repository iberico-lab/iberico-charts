# 05 - Init Containers (extraInitContainers)
# Run setup tasks before the main container starts.
# Each entry is rendered VERBATIM and MUST define `name`.
global:
  name: "init-app"

workload:
  enabled: true
  type: "Deployment"
  image:
    repository: nginx
    tag: "1.25"
  replicas: 1
  applicationPort: 80

  extraInitContainers:
    - name: wait-for-db
      image: busybox:1.36
      command: ["sh", "-c", "until nc -z db 5432; do echo waiting; sleep 2; done"]
    - name: seed-config
      image: busybox:1.36
      command: ["sh", "-c", "echo 'ready' > /workdir/status"]

service:
  enabled: true
