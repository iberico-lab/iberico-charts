# 11 - Service
# Top-level `service` block. Controls type, ports, and annotations of the
# external Service that fronts the workload.
global:
  name: "service-app"

workload:
  enabled: true
  type: "Deployment"
  image:
    repository: nginx
    tag: "1.25"
  replicas: 2
  applicationPort: 8080

service:
  enabled: true
  # Expose beyond the cluster.
  type: LoadBalancer
  port: 80
  targetPort: 8080
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
