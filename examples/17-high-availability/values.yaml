# 17 - High availability: survive maintenance, scale with traffic.
global:
  name: "ha-demo"

workload:
  image:
    repository: nginx
    tag: "1.27"
  resources:
    requests: { cpu: 200m, memory: 128Mi }   # autoscaling measures against this
    limits:   { memory: 256Mi }
  # Give in-flight requests time to finish before the pod stops.
  lifecycle:
    preStop:
      exec:
        command: ["sh", "-c", "sleep 10"]

# Between 3 and 6 pods, aiming for 70% CPU. workload.replicas is ignored.
# 3 is the minimum for high availability: one pod can fail while another updates.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Node drains and upgrades keep at least 2 pods running.
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Never put two pods on the same node, so a node dying takes at most one.
# (On by default as a preference; DoNotSchedule makes it a rule.)
topologySpread:
  whenUnsatisfiable: DoNotSchedule
